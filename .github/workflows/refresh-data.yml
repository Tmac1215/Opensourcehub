name: Refresh tool data

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Fetch and curate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_software.py

      - name: Sanity check (never publish a broken refresh)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          new = json.load(open('data/software.json'))
          old = json.loads(subprocess.run(['git', 'show', 'HEAD:data/software.json'],
                                          capture_output=True, text=True, check=True).stdout)
          n, o = len(new['software']), len(old['software'])
          print(f'tools: old={o} new={n}')
          if n < 0.8 * o:
              sys.exit(f'Refusing to publish: tool count dropped from {o} to {n}')
          if len({t['category'] for t in new['software']}) < 8:
              sys.exit('Refusing to publish: too few categories')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet data/software.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/software.json
          git commit -m "Refresh tool data ($(date -u +%Y-%m-%d))"
          git push
